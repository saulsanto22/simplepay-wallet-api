spring.application.name=wallet-api

# --- 1. Konfigurasi Database In-Memory H2 ---
spring.datasource.url=jdbc:h2:mem:walletdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# --- 2. Aktifkan H2 Web Console (GUI Database di Browser) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# --- 3. Konfigurasi JPA / Hibernate (Auto DDL & Log SQL) ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
